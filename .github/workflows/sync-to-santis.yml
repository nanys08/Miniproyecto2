name: Sync to Santis098/miniproyecto2

on:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Santis098/miniproyecto2
        env:
          PAT: ${{ secrets.SANTIS_PAT }}
        run: |
          git remote add santis https://Santis098:${PAT}@github.com/Santis098/miniproyecto2.git
          git push santis main --force 2>&1 || (echo "EXIT CODE: $?" && exit 1)
