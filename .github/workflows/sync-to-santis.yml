name: Sync to Santis098/miniproyecto2

on:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Santis098/miniproyecto2
        env:
          PAT: ${{ secrets.SANTIS_PAT }}
        run: |
          git config --global --unset http.https://github.com/.extraheader || true
          echo "https://oauth2:${PAT}@github.com" > ~/.git-credentials
          git config --global credential.helper store
          git remote add santis https://github.com/Santis098/miniproyecto2.git
          git push santis main --force
