services:
  - type: web
    name: miniproyecto2-backend
    runtime: node
    # --include=dev necesario: TypeScript y @types/* están en devDependencies
    # y NODE_ENV=production los excluiría con un npm install plano.
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      # PORT lo asigna Render automáticamente, no fijar.
      - key: FIREBASE_API_KEY
        sync: false
      - key: FIREBASE_AUTH_DOMAIN
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_STORAGE_BUCKET
        sync: false
      - key: FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: FIREBASE_APP_ID
        sync: false
      - key: FIREBASE_ADMIN_PROJECT_ID
        sync: false
      - key: FIREBASE_ADMIN_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_ADMIN_PRIVATE_KEY
        sync: false
      - key: CORS_ORIGIN
        sync: false
      # Integración con el chat-service (Repositorio 2), desplegado aparte.
      # URL del chat-service en Render (para informar entradas / cierres de sala).
      - key: CHAT_SERVICE_URL
        sync: false
      # Secreto compartido — DEBE ser idéntico al INTERNAL_SECRET del chat-service.
      - key: INTERNAL_SECRET
        sync: false
